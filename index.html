<!DOCTYPE html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Intent Finance</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10041/10041644.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              background: '#121212',
              surface: '#1C1C1E',
              sage: {
                DEFAULT: '#7da186',
                dim: 'rgba(125, 161, 134, 0.2)',
              },
              gold: {
                DEFAULT: '#C0A769',
                dim: 'rgba(192, 167, 105, 0.2)',
              }
            },
            borderRadius: {
              '3xl': '24px',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #121212;
        color: white;
        overscroll-behavior-y: contain; /* Evita pull-to-refresh indesejado */
      }
      .glass-card {
        background: rgba(28, 28, 30, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-modal {
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(32px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Otimização para toque mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registrado:', registration);
          }).catch(error => {
            console.log('Erro no registro do SW:', error);
          });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
